name: Sync upstream branches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            variant: master
          - branch: "123"
            variant: search
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/qist/tvbox.git
          git fetch upstream master

      - name: Merge upstream and preserve Aidongman
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          AIDONGMAN_VARIANT: ${{ matrix.variant }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/sync-upstream.sh "$TARGET_BRANCH" "$AIDONGMAN_VARIANT"
