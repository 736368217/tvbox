name: Sync xiaosa only

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-xiaosa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 123
        uses: actions/checkout@v4
        with:
          ref: "123"
          fetch-depth: 0

      - name: Sync xiaosa and prune
        env:
          TARGET_BRANCH: "123"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/sync-upstream.sh "$TARGET_BRANCH"
